name: RoomScanner
options:
  bundleIdPrefix: org.nova
  deploymentTarget:
    iOS: "17.0"
targets:
  RoomScanner:
    type: application
    platform: iOS
    sources: [RoomScanner]
    info:
      path: RoomScanner/Info.plist
      properties:
        CFBundleDisplayName: RoomScanner
        NSCameraUsageDescription: RoomScanner uses the camera and LiDAR scanner to capture the floor plan.
        UILaunchScreen: {}
        # Exports land in Documents; these two keys show that folder in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIRequiredDeviceCapabilities: [arkit]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.nova.RoomScanner
      TARGETED_DEVICE_FAMILY: "1,2"
      SWIFT_VERSION: "6.0"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: ""
